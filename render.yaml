services:
  - type: web
    name: ccg-locacoes-site
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.23.4"
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_SITE_URL
        value: https://ccglocacao.com.br
      - key: QUOTE_FROM_EMAIL
        value: "Site CCG Locações <noreply@ccglocacao.com.br>"
      - key: QUOTE_TO_EMAIL
        value: contratos@ccglocacao.com.br
      - key: PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: PUBLIC_GA4_ID
        sync: false
      - key: PUBLIC_CLARITY_ID
        sync: false
